<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix clone</title>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/hero.css">
</head>

<body>
    <header class="navbar">

        <div class="netflix-logo">
            <img src="https://occ.a.nflxso.net/dnmt/api/v6/iL4oJVDYZ8KLSrJ6eG2OwtghbfQ/AAAAAQ4TXm1OaapkwYRGseWYrT2HFpAFV7IX9bgV76BxLOD_049HTkgqZ6zq3enQ0gxU1b-868yGZj1I99Ak9oRykNILYsbpT_0d-be9QKbwkD8OfaEdWL-FHZBiORJ9ppzVCM1-mVn63afS.svg"
                alt="netflix logo">
        </div>

        <div class="nav-right">

            <button class="language-btn">
                <span>文</span> English
                <span class="arrow">⌄</span>
            </button>

            <button class="sign-in-btn">
                Sign In
            </button>
        </div>
    </header>


    <section class="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>In the mood for great entertainment?</h1>

            <h2>Starts at ₹149. Cancel at any time.</h2>

            <p>
                Ready to watch? Enter your email to create or restart your membership.
            </p>

            <form class="email-form">
                <input type="email" placeholder="Email address" aria-label="Email address">

                <button type="button">
                    Get Started <span aria-hidden="true">›</span>
                </button>
            </form>
        </div>
    </section>
</body>

</html>
